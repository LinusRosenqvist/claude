<!doctype html>
<html><head><meta charset="utf-8"><title>Nivåöversikt</title>
<style>body{margin:0;background:#111;color:#fff;font:12px monospace}canvas{display:block;image-rendering:pixelated}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../js/util.js"></script><script src="../js/font.js"></script><script src="../js/input.js"></script>
<script src="../js/sprites.js"></script><script src="../js/art.js"></script><script src="../js/engine.js"></script>
<script src="../js/fx.js"></script><script src="../js/audio.js"></script><script src="../js/themes.js"></script>
<script src="../js/tiles.js"></script><script src="../js/level.js"></script><script src="../js/player.js"></script>
<script src="../js/entities.js"></script><script src="../js/enemies.js"></script><script src="../js/world.js"></script>
<script src="../js/hud.js"></script><script src="../js/save.js"></script>
<script src="../js/levels/world1.js"></script><script src="../js/levels/world2.js"></script><script src="../js/levels/world3.js"></script>
<script src="../js/levels/world4.js"></script><script src="../js/levels/world5.js"></script><script src="../js/levels/world6.js"></script>
<script>
HK.Art.build();
HK.Save.load();
const q = new URLSearchParams(location.search);
const id = q.get('level') || '1-1';
const scale = +(q.get('s') || 1);
const def = HK.LEVELS.find(d => d.id === id);
const W = new HK.World(def, {});
W.darkness = 0;
for (const e of W.enemies) e.active = true;
const lvl = W.level;
const big = document.getElementById('c');
big.width = lvl.pw * scale; big.height = lvl.ph * scale;
const bctx = big.getContext('2d'); bctx.imageSmoothingEnabled = false;
const tmp = HK.U.makeCanvas(480, 270); const tctx = tmp.getContext('2d');
for (let cy = 0; cy < lvl.ph; cy += 270) for (let cx = 0; cx < lvl.pw; cx += 480) {
  W.cam.x = cx; W.cam.y = cy; W.cam.minX = -1e9; W.cam.maxX = 1e9; W.cam.minY = -1e9; W.cam.maxY = 1e9;
  W.draw(tctx);
  bctx.drawImage(tmp, cx * scale, cy * scale, 480 * scale, 270 * scale);
}
// rutnät + koordinater
bctx.fillStyle = 'rgba(255,255,255,0.35)';
for (let x = 0; x < lvl.w; x += 10) { bctx.fillRect(x * 16 * scale, 0, 1, 6); HK.Font.draw(bctx, String(x), x * 16 * scale + 2, 2, { color: '#fff', scale: 1 }); }
for (let y = 0; y < lvl.h; y += 5) { bctx.fillRect(0, y * 16 * scale, 6, 1); HK.Font.draw(bctx, String(y), 2, y * 16 * scale + 2, { color: '#fff' }); }
// markera Kevins gömställen
for (const s of W.kevin.spots) { bctx.strokeStyle = '#ff0'; bctx.lineWidth = 2; bctx.strokeRect(s.x * 16 * scale - 2, s.y * 16 * scale - 18, 20, 36); }
if (window.REACH) { bctx.fillStyle = 'rgba(0,255,0,0.5)'; for (const r of window.REACH) bctx.fillRect(r[0] * scale - 1, r[1] * scale - 1, 3, 3); }
window.__done = true;
</script></body></html>
